version: 2.1

jobs:
  node-demo:
    docker:
      - image: cimg/node:22.11
    working_directory: ~/project
    steps:
      - checkout
      - restore_cache:
          keys:
            - node-demo-{{ checksum "package-lock.json" }}
            - node-demo-
      - run:
          name: Install dependencies
          command: npm install
      - save_cache:
          key: node-demo-{{ checksum "package-lock.json" }}
          paths:
            - ~/.npm
      - run:
          name: Build
          command: npm run build
      - run:
          name: Test
          command: npm test
      - run:
          name: Lint
          command: npm run lint

workflows:
  version: 2
  node-demo-workflow:
    jobs:
      - node-demo
